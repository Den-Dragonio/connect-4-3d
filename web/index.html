<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#23262b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Connect 4 3D">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>Connect 4 — 3D</title>
    <link rel="stylesheet" type="text/css" href="./theme/love.css">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        background-color: #23262b !important;
        color: #f2f5fa !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #23262b;
      }
      #canvas, #loadingCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
        touch-action: none;
        border: none;
        outline: none;
      }
      #canvas {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="1280" height="800"></canvas>
      <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script type="text/javascript">
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      }

      function goFullScreen() {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen().catch(function(){});
      }

      // Universal Mobile Touch & Pinch-to-Zoom Bridge for iOS Safari & Android Chrome
      (function setupMobileTouchBridge() {
        var canvas = document.getElementById('canvas');
        var lastX = 0, lastY = 0;
        var lastPinch = null;
        var isTouching = false;

        function dispatchMouse(type, clientX, clientY, movX, movY) {
          var ev = new MouseEvent(type, {
            bubbles: true,
            cancelable: true,
            view: window,
            button: 0,
            buttons: (type === 'mouseup') ? 0 : 1,
            clientX: clientX,
            clientY: clientY,
            movementX: movX || 0,
            movementY: movY || 0
          });
          canvas.dispatchEvent(ev);
        }

        canvas.addEventListener('touchstart', function(e) {
          e.preventDefault();
          window.focus();
          if (e.touches.length === 1) {
            isTouching = true;
            lastPinch = null;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            dispatchMouse('mousemove', lastX, lastY, 0, 0);
            dispatchMouse('mousedown', lastX, lastY, 0, 0);
          } else if (e.touches.length >= 2) {
            var dx = e.touches[0].clientX - e.touches[1].clientX;
            var dy = e.touches[0].clientY - e.touches[1].clientY;
            lastPinch = Math.hypot(dx, dy);
          }
        }, { passive: false });

        canvas.addEventListener('touchmove', function(e) {
          e.preventDefault();
          if (e.touches.length >= 2) {
            var dx = e.touches[0].clientX - e.touches[1].clientX;
            var dy = e.touches[0].clientY - e.touches[1].clientY;
            var dist = Math.hypot(dx, dy);
            if (lastPinch !== null) {
              var delta = lastPinch - dist;
              if (Math.abs(delta) > 2) {
                var wheelEv = new WheelEvent('wheel', {
                  bubbles: true,
                  cancelable: true,
                  deltaY: delta * 1.5
                });
                canvas.dispatchEvent(wheelEv);
              }
            }
            lastPinch = dist;
          } else if (e.touches.length === 1 && isTouching) {
            var cx = e.touches[0].clientX;
            var cy = e.touches[0].clientY;
            var mx = cx - lastX;
            var my = cy - lastY;
            lastX = cx;
            lastY = cy;
            dispatchMouse('mousemove', cx, cy, mx, my);
          }
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
          e.preventDefault();
          if (e.touches.length < 2) {
            lastPinch = null;
          }
          if (e.touches.length === 0 && isTouching) {
            isTouching = false;
            dispatchMouse('mouseup', lastX, lastY, 0, 0);
          }
        }, { passive: false });
      })();

      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;
        loadingContext.fillStyle = "rgb(35, 38, 43)";
        loadingContext.fillRect(0, 0, canvas.width, canvas.height);

        loadingContext.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        loadingContext.textAlign = 'center';
        loadingContext.fillStyle = "rgb(242, 245, 250)";
        loadingContext.fillText(text, canvas.width / 2, canvas.height / 2 + 10);

        loadingContext.font = '600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        loadingContext.fillStyle = "rgb(173, 181, 194)";
        loadingContext.fillText("CONNECT 4 — 3D", canvas.width / 2, canvas.height / 2 - 45);
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }
      }, false);

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 67108864,
        printErr: console.error.bind(console),
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. Reload the page.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
          } else if (Module.remainingDependencies === 0) {
            document.getElementById('loadingCanvas').style.display = 'none';
            document.getElementById('canvas').style.visibility = 'visible';
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Загрузка 3D-движка... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Готово!');
        }
      };
      Module.setStatus('Загрузка игры...');
      window.onerror = function(event) {
        Module.setStatus('Ошибка WebGL — перезагрузите страницу');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      var applicationLoad = function(e) {
        Love(Module);
      }
    </script>
    <script type="text/javascript" src="./game.js"></script>
    <script async type="text/javascript" src="./love.js" onload="applicationLoad(this)"></script>
  </body>
</html>
